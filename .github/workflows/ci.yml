name: CI

# O microdado do SINAN não está no repositório e nunca vai estar, então o CI
# roda o subconjunto da suíte que não depende dele: 33 testes de lógica pura
# (formatadores, validação de URL, filtros, estrutura dos GeoJSONs). Os outros
# 55 pulam com mensagem explícita — ver o porteiro em tests/conftest.py.
#
# O que isto protege: import quebrado, erro de sintaxe, regressão nos
# formatadores, lock que não instala mais e Dockerfile que não constrói.
# O que NÃO protege: os invariantes epidemiológicos, que precisam da base.
# Esses continuam sendo responsabilidade do `pytest` local antes do deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 porque é a da imagem de produção (python:3.11-slim). Testar em
      # outra versão testaria um ambiente que não existe em lugar nenhum.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instala as versões que estão no ar
        run: pip install -r requirements-dev.txt

      - name: Testes
        run: python -m pytest

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Construir a imagem é o que prova que o lock ainda instala num ambiente
      # limpo. Sem este job, um lock quebrado só apareceria no deploy.
      - name: Constrói a imagem
        run: docker build -t tbpe:ci .

      # O `tr -d '\r'` não é supérfluo: quem commita do Windows pode gravar o
      # lock com CRLF, e aí o diff acusa as 43 linhas como diferentes.
      - name: Confere que a imagem tem as versões do lock
        run: |
          docker run --rm tbpe:ci pip freeze | tr -d '\r' | sort -f > /tmp/imagem.txt
          grep -v '^#' requirements.lock.txt | grep -v '^$' | tr -d '\r' | sort -f > /tmp/lock.txt
          diff /tmp/lock.txt /tmp/imagem.txt
