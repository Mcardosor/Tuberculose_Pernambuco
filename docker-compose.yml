services:
  dashboard-tb-pernambuco:
    build: .
    container_name: dashboard-tb-pernambuco
    restart: unless-stopped
    ports:
      # 8501 demográfico · 8502 TB nacional · 8503 Recife · 8505 hanseníase
      # · 8506 Superset — 8504 estava livre
      - "8504:8501"
    volumes:
      - ./dados_dashboard:/app/dados_dashboard:ro
    environment:
      # RAIZ da aplicação Superset, não um dashboard específico: a Análise Livre
      # entrega o Superset inteiro (SQL Lab, criação de gráficos, datasets) para
      # quem quiser explorar por conta própria.
      - SUPERSET_URL=https://painel.cenarios.unb.br/cenarios/superset/
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/cenarios/tbpe/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
