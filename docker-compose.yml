# Painel de tuberculose de Pernambuco — `tbpe`.
#
# Hospedagem nossa, na VM (`/cenarios/tbpe/`), como o sinan e o hansepe. Os
# dados são **do painel**: `./data`, com as partições de tuberculose e mais
# nada, montado somente leitura. Até 30/set/2026 era o lago inteiro do painel
# nacional (241 MB, cinco doenças), e mexer nele derrubava os outros painéis.
# Gerar com `python -m scripts.extrair_dados_tuberculose`.
#
# Substitui o container da geração anterior (Superset + `dados_dashboard/`),
# que ocupava o mesmo caminho e a mesma porta: pare aquele antes de subir
# este — `docs/deploy.md`.
services:
  dashboard:
    build: .
    image: tbpe:latest
    container_name: tbpe
    restart: unless-stopped
    ports:
      # 8504 era a do tbpe antigo, que este substitui no mesmo caminho.
      - 8504:8501
    environment:
      - PYTHONUNBUFFERED=1
      - SINAN_DATA_DIR=/app/data
      - SINAN_DOENCA=tuberculose
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Código montado do repositório: `git pull` + restart aplica mudança sem
      # rebuild. A imagem já tem uma cópia, então o container sobe mesmo se o
      # volume faltar.
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      - ./.streamlit:/app/.streamlit:ro
      # A extração de tuberculose deste painel, somente leitura. `DADOS`
      # existe para quem quiser apontar para outro lugar; o padrão é a pasta
      # do próprio repositório.
      - ${DADOS:-./data}:/app/data:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1500M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8501/cenarios/tbpe/_stcore/health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
